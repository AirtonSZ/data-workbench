[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "common"
version = "0.0.1"
description = "An environment to develop multiple data projects"
authors = [
  { name = "AirtonSZ" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.13.5"


[tool.ruff]
line-length = 99
src = ["common"]
include = ["pyproject.toml", "common/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["common"]
force-sort-within-sections = true

